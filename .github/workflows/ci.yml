name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m compileall -q scripts tests
      - run: python scripts/validate_examples.py
      - run: python -m pytest -q
      - run: python scripts/validate_resume_artifacts.py --skill-dir .
      - name: Reject local absolute paths in tracked files
        run: |
          if git grep -nE '/Users/|/home/|[A-Za-z]:\\\\' -- ':!*.lock' ':!.github/workflows/ci.yml'; then
            echo 'Tracked files contain a machine-local absolute path.' >&2
            exit 1
          fi

  public-smoke:
    name: Public PDF smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r scripts/requirements.txt
      - run: cargo install typst-cli --version 0.15.1 --locked
      - run: python scripts/environment_doctor.py --font "Noto Sans CJK SC" --json
      - run: python scripts/run_smoke_test.py
        env:
          # Public CI uses a redistributable test font. Production defaults to
          # Microsoft YaHei and is checked by the private render environment.
          RESUME_CJK_FONT: Noto Sans CJK SC
